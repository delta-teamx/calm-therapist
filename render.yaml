# Render blueprint: the backend. The same Next.js app, run as a Node web
# service for the API routes, dashboard, auth, and admin. Netlify proxies
# those paths here. Data lives in Supabase; the email queue is drained by
# the cron job below.
# Import at dashboard.render.com > Blueprints > New Blueprint Instance.
services:
  - type: web
    name: calm-therapist
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: AUTH_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: AURA_MODEL
        value: gpt-5.4-mini
      - key: AURA_REASONING
        value: low
      # Supabase: pooled URL for the app, direct URL for migrations.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_DIRECT_URL
        sync: false
      # The public site address (Netlify or your domain), used in emails and links.
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: COOKIE_DOMAIN
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: NEXT_PUBLIC_ELEVENLABS_AGENT_ID
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_REPLY_TO
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: NEXT_PUBLIC_KOFI_URL
        sync: false

  # Drains the lifecycle email queue every five minutes.
  - type: cron
    name: calm-therapist-emails
    runtime: node
    plan: starter
    region: frankfurt
    schedule: "*/5 * * * *"
    buildCommand: "true"
    startCommand: >-
      curl -fsS -X POST
      -H "x-cron-secret: $CRON_SECRET"
      "https://calm-therapist.onrender.com/api/cron/emails"
    envVars:
      - key: CRON_SECRET
        fromService:
          type: web
          name: calm-therapist
          envVarKey: CRON_SECRET
