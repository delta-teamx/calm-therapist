# Render blueprint: the backend. The same Next.js app, run as a Node web
# service for the API routes, dashboard, auth, and admin. Netlify proxies
# those paths here. Data lives in Supabase; the email queue is drained by
# the cron job below.
# Import at dashboard.render.com > Blueprints > New Blueprint Instance.
services:
  - type: web
    name: calm-therapist
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: AUTH_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: AURA_MODEL
        value: gpt-5.4-mini
      - key: AURA_REASONING
        value: low
      # Supabase: pooled URL for the app, direct URL for migrations.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_DIRECT_URL
        sync: false
      # The public site address (Netlify or your domain), used in emails and links.
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: COOKIE_DOMAIN
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: NEXT_PUBLIC_ELEVENLABS_AGENT_ID
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_REPLY_TO
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: NEXT_PUBLIC_KOFI_URL
        sync: false
      # Ko-fi's static webhook token (Ko-fi > Settings > API). Without it
      # /api/kofi/webhook answers 503 and nobody can unlock voice.
      - key: KOFI_VERIFICATION_TOKEN
        sync: false
      # Public copy reads this to print the minimum ask. Keep the two in step.
      - key: MIN_SUPPORT_USD
        value: "5"
      - key: NEXT_PUBLIC_MIN_SUPPORT_USD
        value: "5"
      # Brand and gates. NEXT_PUBLIC_* values are inlined at build time, so
      # they must be present here before the build runs, not just at runtime.
      - key: NEXT_PUBLIC_BRAND_NAME
        sync: false
      - key: NEXT_PUBLIC_CIRCLES_OPEN_AT
        value: "50"
      - key: FOUNDING_MEMBER_CAP
        value: "150"
      - key: NEXT_PUBLIC_FOUNDING_CAP
        value: "150"
      # Safety: the second classifier pass. Leave CRISIS_LLM_PASS on.
      - key: SAFETY_MODEL
        value: gpt-5.4-mini
      - key: CRISIS_LLM_PASS
        value: "1"

  # Drains the lifecycle email queue and re-arms the weekly look-back.
  # NOTE: the URL below is hardcoded. If Render gives the web service a name
  # other than "calm-therapist", this silently stops working — no email is
  # ever sent and nothing errors. Update it, and the seven `to =` lines in
  # netlify.toml, to match the real service address.
  - type: cron
    name: calm-therapist-emails
    runtime: node
    plan: starter
    region: frankfurt
    schedule: "*/5 * * * *"
    buildCommand: "true"
    startCommand: >-
      curl -fsS -X POST
      -H "x-cron-secret: $CRON_SECRET"
      "https://calm-therapist.onrender.com/api/cron/emails"
    envVars:
      - key: CRON_SECRET
        fromService:
          type: web
          name: calm-therapist
          envVarKey: CRON_SECRET
